<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrownSMP Store</title>
    <style id="dynamic-styles">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: #080a10;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            width: 100%;
        }

        /* YouTube Background Wrapper */
        .video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .video-bg-container iframe {
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Dynamic Overlay for Opacity */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 10, 16, var(--bg-opacity, 0.75));
            z-index: -1;
            transition: background 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(12, 16, 26, 0.95);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-box { display: flex; align-items: center; gap: 18px; }

        .gold-ring-logo {
            width: 70px; height: 70px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #0d111a; overflow: hidden;
        }

        .gold-ring-logo img { width: 85%; height: 85%; object-fit: contain; }

        .brand-text h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        .brand-text span { font-size: 0.85rem; color: #94a3b8; }

        nav { display: flex; gap: 25px; }
        nav a { color: #ffffff; text-decoration: none; font-weight: 800; font-size: 1rem; letter-spacing: 1.5px; transition: 0.3s; }

        section {
            padding: 40px 5%;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center;
            width: 100%;
        }

        .hero-banner {
            padding-top: 60px;
            padding-bottom: 50px;
        }

        .hero-banner h2 { font-size: 3.8rem; font-weight: 900; margin-bottom: 15px; letter-spacing: 3px; text-transform: uppercase; }
        .hero-banner p { color: #e2e8f0; font-size: 1.2rem; margin-bottom: 30px; max-width: 750px; font-weight: 500; }

        .ip-box {
            display: inline-block; background: #0f172a; padding: 14px 35px; border-radius: 40px;
            font-size: 1.3rem; font-weight: 800; letter-spacing: 1px;
        }

        .section-heading { 
            font-size: 2.5rem; 
            font-weight: 900; 
            margin-bottom: 30px; 
            text-transform: uppercase; 
            letter-spacing: 2.5px; 
        }

        .cards-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px; 
            width: 100%; 
            max-width: 1350px;
        }

        .card {
            border-radius: 18px; 
            padding: 30px 25px; 
            text-align: left; 
            transition: all 0.3s ease;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            position: relative;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; margin-bottom: 18px; }
        .card h3 { font-size: 2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; }
        .card .price { font-size: 2rem; font-weight: 900; color: #e63946; }

        .perks-list { list-style: none; margin-bottom: 25px; }
        .perks-list li { font-size: 0.95rem; color: #e2e8f0; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .perks-list li::before { content: "✓"; color: #4ade80; font-weight: 900; }

        .buy-btn {
            width: 100%; background: linear-gradient(135deg, #e63946, #b71c1c); border: none; color: #ffffff;
            padding: 14px; font-weight: 900; font-size: 1.1rem; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s;
        }

        @media (max-width: 850px) {
            header { flex-direction: column; gap: 15px; }
            .hero-banner h2 { font-size: 2.3rem; }
            .section-heading { font-size: 2rem; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="video-bg-container" id="yt-bg-wrapper"></div>

    <header>
        <div class="brand-box">
            <div class="gold-ring-logo"><img id="dyn-logo" src="" alt="Logo"></div>
            <div class="brand-text">
                <h1 id="dyn-title">CrownSMP</h1>
                <span id="dyn-subtext">Official Server Store</span>
            </div>
        </div>
        <nav>
            <a href="#home">HOME</a>
            <a href="#ranks">RANKS</a>
            <a href="#keys">KEYS</a>
            <a href="#shards">SHARDS</a>
            <a href="#" id="dyn-discord" target="_blank">DISCORD</a>
        </nav>
    </header>

    <section id="home" class="hero-banner">
        <h2>WELCOME TO <span id="dyn-hero-title">CrownSMP</span></h2>
        <p>The ultimate premium Minecraft survival experience. Support the server and unlock exclusive perks today!</p>
        <div class="ip-box" id="dyn-ip">Play.CrownSMP.net:40008</div>
    </section>

    <section id="ranks">
        <h2 class="section-heading">PREMIUM RANKS</h2>
        <div class="cards-grid" id="ranks-container"></div>
    </section>

    <section id="keys">
        <h2 class="section-heading">CRATE KEYS</h2>
        <div class="cards-grid" id="keys-container"></div>
    </section>

    <section id="shards">
        <h2 class="section-heading">SHARDS STORE</h2>
        <div class="cards-grid" id="shards-container"></div>
    </section>

    <script>
        // Default Config with YouTube Background pre-set
        const defaultConfig = {
            serverName: 'CrownSMP',
            subtext: 'Official Server Store',
            bgUrl: 'https://youtu.be/Im6RusHotNY?si=TMO2ED1j_xIoHQBM',
            logoUrl: 'https://i.imgur.com/vH93R5D.png',
            discordUrl: 'https://discord.gg/',
            serverIp: 'Play.CrownSMP.net:40008',
            accentColor: '#ff9f1c',
            cardBg: '#111622',
            bgOpacity: '0.75',
            audioState: '0' // 0 = Muted, 1 = Unmuted
        };

        const cfg = JSON.parse(localStorage.getItem('site_config')) || defaultConfig;

        // Set Opacity Variable for CSS
        document.documentElement.style.setProperty('--bg-opacity', cfg.bgOpacity || '0.75');

        // YouTube Video ID Extractor
        function getYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(?:youtu.be\/|v\/|e\/|u\/\w+\/|embed\/|v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[1].length === 11) ? match[1] : null;
        }

        const ytId = getYouTubeId(cfg.bgUrl);
        if (ytId) {
            const muteVal = cfg.audioState === '1' ? '0' : '1';
            // Optimized with loading="lazy" and performance tweaks to eliminate buffering lag
            document.getElementById('yt-bg-wrapper').innerHTML = `
                <iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=${muteVal}&controls=0&loop=1&playlist=${ytId}&enablejsapi=1&playsinline=1" 
                    loading="lazy" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            `;
        } else {
            document.body.style.backgroundImage = `url('${cfg.bgUrl}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed';
        }

        document.getElementById('dyn-logo').src = cfg.logoUrl;
        document.getElementById('dyn-title').innerText = cfg.serverName;
        document.getElementById('dyn-hero-title').innerText = cfg.serverName;
        document.getElementById('dyn-subtext').innerText = cfg.subtext;
        document.getElementById('dyn-ip').innerText = cfg.serverIp;
        document.getElementById('dyn-discord').href = cfg.discordUrl;

        const styleTag = document.createElement('style');
        styleTag.innerHTML = `
            .brand-text h1, .section-heading, .hero-banner h2 { color: ${cfg.accentColor}; }
            header { border-bottom: 2px solid ${cfg.accentColor}; }
            .gold-ring-logo { border: 3px solid ${cfg.accentColor}; box-shadow: 0 0 15px ${cfg.accentColor}; }
            .ip-box { border: 2px solid ${cfg.accentColor}; color: ${cfg.accentColor}; box-shadow: 0 0 15px ${cfg.accentColor}; }
            .card { background: ${cfg.cardBg}; border: 2px solid ${cfg.accentColor}55; }
            .card h3 { color: ${cfg.accentColor}; }
        `;
        document.head.appendChild(styleTag);

        // Fallback Ranks, Keys, Shards
        let ranks = JSON.parse(localStorage.getItem('site_ranks')) || [
            { name: "PLUS", price: "49", desc: "Basic perks", perks: ["Protection 3 diamond armour", "Iron tools", "2 PV", "2 Homes"] },
            { name: "VIP", price: "199", desc: "CrownSMP power", perks: ["3 PV", "4 Homes", "/echest", "VIP tag"] },
            { name: "TITAN", price: "299", desc: "Rise above", perks: ["5 PV", "6 Homes", "/anvil", "Colored name"] },
            { name: "ELITE", price: "499", desc: "Elite privileges", perks: ["7 PV", "8 Homes", "/fly on spawn", "/echest"] }
        ];

        let keys = JSON.parse(localStorage.getItem('site_keys')) || [
            { name: "GOLD KEY", price: "49" },
            { name: "CRIMSON KEY", price: "79" }
        ];

        let shards = JSON.parse(localStorage.getItem('site_shards')) || [
            { name: "10 SHARDS", price: "15" },
            { name: "50 SHARDS", price: "40" }
        ];

        // Render Cards
        document.getElementById('ranks-container').innerHTML = ranks.map(r => `
            <div class="card">
                <div>
                    <div class="card-header">
                        <h3>${r.name}</h3>
                        <div class="price">₹${r.price}</div>
                    </div>
                    <p style="color:#94a3b8;margin-bottom:15px;">${r.desc || ''}</p>
                    <ul class="perks-list">
                        ${(r.perks || []).map(p => `<li>${p}</li>`).join('')}
                    </ul>
                </div>
                <button class="buy-btn">BUY • ₹${r.price}</button>
            </div>
        `).join('');

        document.getElementById('keys-container').innerHTML = keys.map(k => `
            <div class="card">
                <div class="card-header">
                    <h3>${k.name}</h3>
                    <div class="price">₹${k.price}</div>
                </div>
                <button class="buy-btn">BUY • ₹${k.price}</button>
            </div>
        `).join('');

        document.getElementById('shards-container').innerHTML = shards.map(s => `
            <div class="card">
                <div class="card-header">
                    <h3>${s.name}</h3>
                    <div class="price">₹${s.price}</div>
                </div>
                <button class="buy-btn">BUY • ₹${s.price}</button>
            </div>
        `).join('');
    </script>
</body>
</html>
