<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrownSMP | Full Control Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #121722;
            border-right: 1px solid #2d3748;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar h2 {
            color: #ffb703;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #2d3748;
            color: #b0c0d8;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: left;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #ffb703;
            color: #000;
            border-color: #ffb703;
        }

        .main-content {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
        }

        .panel-section {
            display: none;
        }

        .panel-section.active {
            display: block;
        }

        h3.section-title {
            color: #ffb703;
            font-size: 1.8rem;
            margin-bottom: 25px;
            border-bottom: 2px solid #2d3748;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
            max-width: 700px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #e2e8f0;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: #161b22;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
        }

        .form-group input[type="color"] {
            height: 45px;
            padding: 5px;
            cursor: pointer;
        }

        .save-btn {
            background: linear-gradient(135deg, #ffb703, #d35400);
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .save-btn:hover {
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.6);
            transform: translateY(-2px);
        }

        .cancel-btn {
            background: #4a5568;
            color: #fff;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
        }

        .items-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .item-card {
            background: #161b22;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 20px;
            position: relative;
        }

        .card-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .edit-btn {
            background: #ff9f1c;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 800;
        }

        .delete-btn {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 800;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #2d3748;
            }
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <button class="nav-btn active" onclick="showTab('general')">⚙️ General & Links</button>
        <button class="nav-btn" onclick="showTab('ranks')">👑 Edit Ranks</button>
        <button class="nav-btn" onclick="showTab('keys')">🔑 Edit Keys</button>
        <button class="nav-btn" onclick="showTab('shards')">💎 Edit Shards</button>
    </div>

    <div class="main-content">

        <!-- GENERAL, LINKS & STYLES CONTROL -->
        <div id="general" class="panel-section active">
            <h3 class="section-title">General Settings & Media Links</h3>
            
            <div class="form-group">
                <label>Server Name</label>
                <input type="text" id="cfg-server-name" value="CrownSMP">
            </div>

            <div class="form-group">
                <label>Sub-Tagline Text</label>
                <input type="text" id="cfg-subtext" value="Official Server Store">
            </div>

            <div class="form-group">
                <label>Discord Invite Link</label>
                <input type="text" id="cfg-discord-url" placeholder="https://discord.gg/yourserver">
            </div>

            <div class="form-group">
                <label>Server IP Address & Port</label>
                <input type="text" id="cfg-server-ip" value="Play.CrownSMP.net:40008">
            </div>

            <div class="form-group">
                <label>Background Image URL OR YouTube Video Link</label>
                <input type="text" id="cfg-bg-url" placeholder="Paste YouTube Link or Image URL">
            </div>

            <div class="form-group">
                <label>Background Overlay Opacity (0.1 = Bright, 0.9 = Dark)</label>
                <input type="text" id="cfg-bg-opacity" value="0.75" placeholder="e.g. 0.75">
            </div>

            <div class="form-group">
                <label>YouTube Video Audio</label>
                <select id="cfg-audio-state">
                    <option value="0">Muted (Off)</option>
                    <option value="1">Unmuted (On)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Logo Direct URL</label>
                <input type="text" id="cfg-logo-url" value="https://i.imgur.com/vH93R5D.png">
            </div>

            <div class="form-group">
                <label>Accent Glow Color (Hex)</label>
                <input type="color" id="cfg-accent-color" value="#ff9f1c">
            </div>

            <div class="form-group">
                <label>Card Background Color (Hex)</label>
                <input type="color" id="cfg-card-bg" value="#111622">
            </div>

            <button class="save-btn" onclick="saveGeneralSettings()">Save All General & Media Config</button>
        </div>

        <!-- RANKS MANAGER -->
        <div id="ranks" class="panel-section">
            <h3 class="section-title" id="rank-form-title">Add / Edit Rank</h3>
            
            <input type="hidden" id="edit-rank-index" value="-1">
            <div class="form-group">
                <label>Rank Name</label>
                <input type="text" id="rank-name" placeholder="e.g. VIP">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="text" id="rank-price" placeholder="e.g. 199">
            </div>
            <div class="form-group">
                <label>Subtitle / Description</label>
                <input type="text" id="rank-desc" placeholder="e.g. Power up your game">
            </div>
            <div class="form-group">
                <label>Perks (Comma Separated)</label>
                <textarea id="rank-perks" placeholder="3 PV, 4 Homes, /echest, VIP tag"></textarea>
            </div>
            <button class="save-btn" id="rank-submit-btn" onclick="saveRank()">Save Rank</button>
            <button class="cancel-btn" id="rank-cancel-btn" style="display:none;" onclick="resetRankForm()">Cancel Edit</button>

            <h3 class="section-title" style="margin-top:40px;">Existing Ranks</h3>
            <div class="items-list" id="admin-ranks-list"></div>
        </div>

        <!-- KEYS MANAGER -->
        <div id="keys" class="panel-section">
            <h3 class="section-title" id="key-form-title">Add / Edit Crate Key</h3>
            
            <input type="hidden" id="edit-key-index" value="-1">
            <div class="form-group">
                <label>Key Name</label>
                <input type="text" id="key-name" placeholder="e.g. GOLD KEY">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="text" id="key-price" placeholder="e.g. 49">
            </div>
            <button class="save-btn" id="key-submit-btn" onclick="saveKey()">Save Crate Key</button>
            <button class="cancel-btn" id="key-cancel-btn" style="display:none;" onclick="resetKeyForm()">Cancel Edit</button>

            <h3 class="section-title" style="margin-top:40px;">Existing Crate Keys</h3>
            <div class="items-list" id="admin-keys-list"></div>
        </div>

        <!-- SHARDS MANAGER -->
        <div id="shards" class="panel-section">
            <h3 class="section-title" id="shard-form-title">Add / Edit Shards Package</h3>
            
            <input type="hidden" id="edit-shard-index" value="-1">
            <div class="form-group">
                <label>Shard Package Name</label>
                <input type="text" id="shard-name" placeholder="e.g. 50 SHARDS">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="text" id="shard-price" placeholder="e.g. 40">
            </div>
            <button class="save-btn" id="shard-submit-btn" onclick="saveShard()">Save Shard Package</button>
            <button class="cancel-btn" id="shard-cancel-btn" style="display:none;" onclick="resetShardForm()">Cancel Edit</button>

            <h3 class="section-title" style="margin-top:40px;">Existing Shard Packages</h3>
            <div class="items-list" id="admin-shards-list"></div>
        </div>

    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.panel-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Load Configuration
        const defaultConfig = {
            serverName: 'CrownSMP',
            subtext: 'Official Server Store',
            discordUrl: 'https://discord.gg/',
            serverIp: 'Play.CrownSMP.net:40008',
            bgUrl: 'https://youtu.be/Im6RusHotNY?si=TMO2ED1j_xIoHQBM',
            logoUrl: 'https://i.imgur.com/vH93R5D.png',
            accentColor: '#ff9f1c',
            cardBg: '#111622',
            bgOpacity: '0.75',
            audioState: '0'
        };

        const cfg = JSON.parse(localStorage.getItem('site_config')) || defaultConfig;
        document.getElementById('cfg-server-name').value = cfg.serverName;
        document.getElementById('cfg-subtext').value = cfg.subtext;
        document.getElementById('cfg-discord-url').value = cfg.discordUrl;
        document.getElementById('cfg-server-ip').value = cfg.serverIp;
        document.getElementById('cfg-bg-url').value = cfg.bgUrl;
        document.getElementById('cfg-bg-opacity').value = cfg.bgOpacity || '0.75';
        document.getElementById('cfg-audio-state').value = cfg.audioState || '0';
        document.getElementById('cfg-logo-url').value = cfg.logoUrl;
        document.getElementById('cfg-accent-color').value = cfg.accentColor;
        document.getElementById('cfg-card-bg').value = cfg.cardBg;

        function saveGeneralSettings() {
            const updatedConfig = {
                serverName: document.getElementById('cfg-server-name').value,
                subtext: document.getElementById('cfg-subtext').value,
                discordUrl: document.getElementById('cfg-discord-url').value,
                serverIp: document.getElementById('cfg-server-ip').value,
                bgUrl: document.getElementById('cfg-bg-url').value,
                bgOpacity: document.getElementById('cfg-bg-opacity').value,
                audioState: document.getElementById('cfg-audio-state').value,
                logoUrl: document.getElementById('cfg-logo-url').value,
                accentColor: document.getElementById('cfg-accent-color').value,
                cardBg: document.getElementById('cfg-card-bg').value
            };
            localStorage.setItem('site_config', JSON.stringify(updatedConfig));
            alert('Settings Saved Successfully!');
        }

        // Default Items Data
        let ranks = JSON.parse(localStorage.getItem('site_ranks')) || [
            { name: "PLUS", price: "49", desc: "Basic perks", perks: ["Protection 3 diamond armour", "Iron tools", "2 PV", "2 Homes"] },
            { name: "VIP", price: "199", desc: "CrownSMP power", perks: ["3 PV", "4 Homes", "/echest", "VIP tag"] },
            { name: "TITAN", price: "299", desc: "Rise above", perks: ["5 PV", "6 Homes", "/anvil", "Colored name"] },
            { name: "ELITE", price: "499", desc: "Elite privileges", perks: ["7 PV", "8 Homes", "/fly on spawn", "/echest"] }
        ];

        let keys = JSON.parse(localStorage.getItem('site_keys')) || [
            { name: "GOLD KEY", price: "49" },
            { name: "CRIMSON KEY", price: "79" }
        ];

        let shards = JSON.parse(localStorage.getItem('site_shards')) || [
            { name: "10 SHARDS", price: "15" },
            { name: "50 SHARDS", price: "40" }
        ];

        function renderLists() {
            document.getElementById('admin-ranks-list').innerHTML = ranks.map((r, i) => `
                <div class="item-card">
                    <div class="card-actions">
                        <button class="edit-btn" onclick="editRank(${i})">✏️ Edit</button>
                        <button class="delete-btn" onclick="deleteRank(${i})">🗑️ Delete</button>
                    </div>
                    <h3 style="color:#ff9f1c;">${r.name}</h3>
                    <p style="font-weight:bold;margin-top:5px;">Price: ₹${r.price}</p>
                    <p style="font-size:0.85rem;color:#a0aec0;">${r.desc || ''}</p>
                </div>
            `).join('');

            document.getElementById('admin-keys-list').innerHTML = keys.map((k, i) => `
                <div class="item-card">
                    <div class="card-actions">
                        <button class="edit-btn" onclick="editKey(${i})">✏️ Edit</button>
                        <button class="delete-btn" onclick="deleteKey(${i})">🗑️ Delete</button>
                    </div>
                    <h3 style="color:#ff9f1c;">${k.name}</h3>
                    <p style="font-weight:bold;margin-top:5px;">Price: ₹${k.price}</p>
                </div>
            `).join('');

            document.getElementById('admin-shards-list').innerHTML = shards.map((s, i) => `
                <div class="item-card">
                    <div class="card-actions">
                        <button class="edit-btn" onclick="editShard(${i})">✏️ Edit</button>
                        <button class="delete-btn" onclick="deleteShard(${i})">🗑️ Delete</button>
                    </div>
                    <h3 style="color:#ff9f1c;">${s.name}</h3>
                    <p style="font-weight:bold;margin-top:5px;">Price: ₹${s.price}</p>
                </div>
            `).join('');
        }

        function editRank(index) {
            const r = ranks[index];
            document.getElementById('edit-rank-index').value = index;
            document.getElementById('rank-name').value = r.name;
            document.getElementById('rank-price').value = r.price;
            document.getElementById('rank-desc').value = r.desc || '';
            document.getElementById('rank-perks').value = (r.perks || []).join(', ');

            document.getElementById('rank-form-title').innerText = "Edit Rank: " + r.name;
            document.getElementById('rank-submit-btn').innerText = "Update Rank";
            document.getElementById('rank-cancel-btn').style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveRank() {
            const idx = parseInt(document.getElementById('edit-rank-index').value);
            const name = document.getElementById('rank-name').value;
            const price = document.getElementById('rank-price').value;
            const desc = document.getElementById('rank-desc').value;
            const perks = document.getElementById('rank-perks').value.split(',').map(p => p.trim()).filter(p => p);

            if(!name || !price) { alert("Please fill Name and Price!"); return; }

            if(idx >= 0) {
                ranks[idx] = { name, price, desc, perks };
            } else {
                ranks.push({ name, price, desc, perks });
            }

            localStorage.setItem('site_ranks', JSON.stringify(ranks));
            resetRankForm();
            renderLists();
            alert("Rank Saved!");
        }

        function deleteRank(idx) {
            if(confirm("Are you sure you want to delete this rank?")) {
                ranks.splice(idx, 1);
                localStorage.setItem('site_ranks', JSON.stringify(ranks));
                renderLists();
            }
        }

        function resetRankForm() {
            document.getElementById('edit-rank-index').value = "-1";
            document.getElementById('rank-name').value = "";
            document.getElementById('rank-price').value = "";
            document.getElementById('rank-desc').value = "";
            document.getElementById('rank-perks').value = "";
            document.getElementById('rank-form-title').innerText = "Add / Edit Rank";
            document.getElementById('rank-submit-btn').innerText = "Save Rank";
            document.getElementById('rank-cancel-btn').style.display = "none";
        }

        function editKey(index) {
            const k = keys[index];
            document.getElementById('edit-key-index').value = index;
            document.getElementById('key-name').value = k.name;
            document.getElementById('key-price').value = k.price;

            document.getElementById('key-form-title').innerText = "Edit Key: " + k.name;
            document.getElementById('key-submit-btn').innerText = "Update Key";
            document.getElementById('key-cancel-btn').style.display = "inline-block";
        }

        function saveKey() {
            const idx = parseInt(document.getElementById('edit-key-index').value);
            const name = document.getElementById('key-name').value;
            const price = document.getElementById('key-price').value;

            if(!name || !price) { alert("Please fill Name and Price!"); return; }

            if(idx >= 0) {
                keys[idx] = { name, price };
            } else {
                keys.push({ name, price });
            }

            localStorage.setItem('site_keys', JSON.stringify(keys));
            resetKeyForm();
            renderLists();
            alert("Crate Key Saved!");
        }

        function deleteKey(idx) {
            if(confirm("Delete this key?")) {
                keys.splice(idx, 1);
                localStorage.setItem('site_keys', JSON.stringify(keys));
                renderLists();
            }
        }

        function resetKeyForm() {
            document.getElementById('edit-key-index').value = "-1";
            document.getElementById('key-name').value = "";
            document.getElementById('key-price').value = "";
            document.getElementById('key-form-title').innerText = "Add / Edit Crate Key";
            document.getElementById('key-submit-btn').innerText = "Save Crate Key";
            document.getElementById('key-cancel-btn').style.display = "none";
        }

        function editShard(index) {
            const s = shards[index];
            document.getElementById('edit-shard-index').value = index;
            document.getElementById('shard-name').value = s.name;
            document.getElementById('shard-price').value = s.price;

            document.getElementById('shard-form-title').innerText = "Edit Shard: " + s.name;
            document.getElementById('shard-submit-btn').innerText = "Update Shard Package";
            document.getElementById('shard-cancel-btn').style.display = "inline-block";
        }

        function saveShard() {
            const idx = parseInt(document.getElementById('edit-shard-index').value);
            const name = document.getElementById('shard-name').value;
            const price = document.getElementById('shard-price').value;

            if(!name || !price) { alert("Please fill Name and Price!"); return; }

            if(idx >= 0) {
                shards[idx] = { name, price };
            } else {
                shards.push({ name, price });
            }

            localStorage.setItem('site_shards', JSON.stringify(shards));
            resetShardForm();
            renderLists();
            alert("Shard Package Saved!");
        }

        function deleteShard(idx) {
            if(confirm("Delete this shard package?")) {
                shards.splice(idx, 1);
                localStorage.setItem('site_shards', JSON.stringify(shards));
                renderLists();
            }
        }

        function resetShardForm() {
            document.getElementById('edit-shard-index').value = "-1";
            document.getElementById('shard-name').value = "";
            document.getElementById('shard-price').value = "";
            document.getElementById('shard-form-title').innerText = "Add / Edit Shards Package";
            document.getElementById('shard-submit-btn').innerText = "Save Shard Package";
            document.getElementById('shard-cancel-btn').style.display = "none";
        }

        renderLists();
    </script>
</body>
</html>
